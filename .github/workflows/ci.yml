name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Ruff lint (GitHub annotations)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff lint (JSON report for SonarQube)
        run: ruff check . --output-format=json --output-file=ruff-report.json
        continue-on-error: true

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Upload ruff report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Fix ES permission issue
      - name: Prepare Elasticsearch data directory
        run: |
          mkdir -p data/es_data
          sudo chown -R 1000:1000 data/es_data

      # ✅ Required for Elasticsearch
      - name: Set vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      # ✅ Start containers
      - name: Start services
        run: docker compose up -d

      # ✅ HARD WAIT for Elasticsearch (more robust)
      - name: Wait for Elasticsearch
        run: |
          echo "Waiting for Elasticsearch..."
          for i in {1..40}; do
            if curl -s http://localhost:9200 > /dev/null; then
              echo "Elasticsearch is up!"
              break
            fi
            echo "Still waiting..."
            sleep 5
          done

      # ✅ HARD WAIT for DynamoDB
      - name: Wait for DynamoDB
        run: |
          echo "Waiting for DynamoDB..."
          for i in {1..30}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "DynamoDB is up!"
              break
            fi
            echo "Still waiting..."
            sleep 3
          done

      # ✅ Extra safety buffer (Spark startup)
      - name: Extra wait buffer
        run: sleep 15

      # ⚠️ IMPORTANT: use exec instead of run
      # (run creates NEW container → services unreachable)
      - name: Install dependencies in running spark container
        run: docker compose exec -T spark bash -c "cd /app && pip install -r requirements-ci.txt --break-system-packages"

      - name: Run unit tests
        run: docker compose exec -T spark bash -c "cd /app && pytest tests/unit -vv --durations=20 --cov=src --cov-report=xml:coverage.xml --timeout=120"

      - name: Run integration tests
        run: docker compose exec -T spark bash -c "cd /app && pytest tests/integration -vv --durations=20 --timeout=180"

      - name: Copy coverage report
        run: docker compose cp spark:/app/coverage.xml ./coverage.xml || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # 🔥 Show logs if anything fails
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down

  sonarqube:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ruff report
        uses: actions/download-artifact@v4
        with:
          name: ruff-report

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}