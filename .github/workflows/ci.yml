name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Ruff lint (GitHub annotations)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff lint (JSON report for SonarQube)
        run: ruff check . --output-format=json --output-file=ruff-report.json
        continue-on-error: true

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Upload ruff report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start services
        run: docker compose up -d

      - name: Install test dependencies inside spark container
        run: docker compose exec -T spark pip install -r requirements-ci.txt --break-system-packages

      - name: Run tests with coverage
        run: docker compose exec -T spark bash -c "cd /app && pytest --durations=20 --cov=src --cov-report=xml:coverage.xml tests/"

      - name: Copy coverage report out of container
        run: docker compose cp spark:/app/coverage.xml ./coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Stop services
        if: always()
        run: docker compose down

  sonarqube:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ruff report
        uses: actions/download-artifact@v4
        with:
          name: ruff-report

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}